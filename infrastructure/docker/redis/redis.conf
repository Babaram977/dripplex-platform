# Redis 7 — DrippleX production (private network)
# requirepass supplied at runtime via compose command --requirepass ${REDIS_PASSWORD}
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

maxmemory 2gb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec
dir /data

save 900 1
save 300 10
save 60 10000

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
