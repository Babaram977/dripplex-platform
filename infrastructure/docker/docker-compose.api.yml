# Dripplex production API stack (Program D2)
# Frontends run on Cloudflare Workers — this Compose file runs Backend Core only.
#
# Usage on host:
#   cd /opt/dripplex
#   docker compose -f infrastructure/docker/docker-compose.api.yml --env-file .env.production up -d
#
# Requires: Docker Engine 27+ / Compose v2, open ports 80/443 (Cloudflare → origin)

name: dripplex-api

x-restart: &restart
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '5'

services:
  nginx:
    <<: [*restart, *default-logging]
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Deploy script installs bootstrap or LE config as default.conf on the host.
      - ${NGINX_CONF:-../nginx/api.dripplex.com.bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, app]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 5

  certbot:
    <<: [*restart, *default-logging]
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Idle entrypoint — renew via cron / deploy script:
    #   docker compose run --rm certbot renew
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks: [edge]

  backend:
    <<: [*restart, *default-logging]
    image: ${BACKEND_IMAGE:-ghcr.io/babaram977/dripplex-backend-core:1.0.0}
    env_file:
      - ${ENV_FILE:-../../.env.production}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_GLOBAL_PREFIX: api/v1
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [app, data]
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    <<: [*restart, *default-logging]
    image: ${BACKEND_IMAGE:-ghcr.io/babaram977/dripplex-backend-core:1.0.0}
    command: ['node', 'dist/main.js']
    env_file:
      - ${ENV_FILE:-../../.env.production}
    environment:
      NODE_ENV: production
      WORKER_MODE: '1'
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks: [app, data]

  postgres:
    <<: [*restart, *default-logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    networks: [data]
    expose: ['5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    <<: [*restart, *default-logging]
    image: edoburu/pgbouncer:1.22.1.1
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 50
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    expose: ['5432']

  redis:
    <<: [*restart, *default-logging]
    image: redis:7-alpine
    command:
      ['redis-server', '/usr/local/etc/redis/redis.conf', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks: [data]
    expose: ['6379']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  uptime-kuma:
    <<: [*restart, *default-logging]
    image: louislam/uptime-kuma:1.23.15
    volumes:
      - uptime_data:/app/data
    networks: [app]
    expose: ['3001']

networks:
  edge:
  app:
  data:
    internal: true

volumes:
  pg_data:
  redis_data:
  certbot_www:
  certbot_certs:
  uptime_data:
