# Portal deployments (merchant / rider / admin) — same pattern as customer-web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-portal
  namespace: dripplex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-portal
  template:
    metadata:
      labels:
        app: merchant-portal
    spec:
      containers:
        - name: merchant-portal
          image: dripplex/merchant-portal:1.0.0-rc.1
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: '3002'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-portal
  namespace: dripplex
spec:
  selector:
    app: merchant-portal
  ports:
    - port: 3002
      targetPort: 3002
---
