apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-web
  namespace: dripplex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-web
  template:
    metadata:
      labels:
        app: customer-web
    spec:
      containers:
        - name: customer-web
          image: dripplex/customer-web:1.0.0
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: '3001'
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '500m'
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-web
  namespace: dripplex
spec:
  selector:
    app: customer-web
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-web
  namespace: dripplex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
