# Bootstrap nginx (HTTP + self-signed HTTPS) until Let's Encrypt certs exist.
# Deploy script swaps to api.dripplex.com.conf after certbot succeeds.

upstream backend_api {
  server backend:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name api.dripplex.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Allow ACME + temporary HTTP proxy during bootstrap (Cloudflare Flexible / direct)
  location / {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name api.dripplex.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 25m;

  location / {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
