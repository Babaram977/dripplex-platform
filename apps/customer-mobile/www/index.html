<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Dripplex</title>
    <style>
      :root {
        --brand: #0e7a3e;
        --navy: #0a2540;
        --bg: #f4f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--navy);
      }
      .card {
        text-align: center;
        padding: 2rem;
        max-width: 22rem;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 0.875rem;
        background: var(--brand);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        opacity: 0.8;
        font-size: 0.9rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true"></div>
      <h1>Dripplex</h1>
      <p>Connecting…</p>
      <p><small>life, Simplified</small></p>
    </div>
    <p class="sr-only">Loading Dripplex. If this screen persists, check network connectivity.</p>
  </body>
</html>
