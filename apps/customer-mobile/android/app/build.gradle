apply plugin: 'com.android.application'

android {
    namespace "com.dripplex.customer"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dripplex.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1000100
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signing material is only present when the ANDROID_KEYSTORE_* secrets are
    // configured; a fork, a local checkout and CI without those secrets all
    // have no keystore.properties.
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def hasSigningMaterial = keystorePropertiesFile.exists()

    signingConfigs {
        release {
            if (hasSigningMaterial) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                // rootProject.file, not file. This block lives in app/build.gradle,
                // so a bare file() resolves against android/app/ — while
                // keystore.properties itself is read from android/ one line above.
                // The two halves of one config disagreed about their base
                // directory, so `storeFile=release.keystore` was looked for at
                // android/app/release.keystore while CI writes it to
                // android/release.keystore, and the build died with
                // "Keystore file ... not found for signing config 'release'".
                //
                // Invisible until signing actually ran: the steps that write the
                // keystore were skipped on every run until the `if` bug in the
                // workflows was fixed, so hasSigningMaterial was always false and
                // this line never executed.
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Assigning the signing config unconditionally handed AGP a config
            // whose storeFile was null whenever no keystore existed, and
            // :app:signProductionReleaseBundle then died inside
            // FinalizeBundleTask with a bare java.lang.NullPointerException —
            // no mention of signing, no mention of a missing keystore.
            //
            // Without signing material the release build is simply unsigned,
            // which is what a packaging gate needs (it proves the app compiles
            // and bundles). An unsigned artifact is NOT submittable to Play —
            // set the ANDROID_KEYSTORE_* secrets and this signs as before.
            if (hasSigningMaterial) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    flavorDimensions += ["channel"]
    productFlavors {
        production {
            dimension "channel"
        }
        internal {
            dimension "channel"
            versionNameSuffix "-internal"
        }
        closedBeta {
            dimension "channel"
            versionNameSuffix "-beta"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
