
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <!--
        `viewport-fit=cover` is what makes env(safe-area-inset-*) mean anything.
        Without it iOS keeps the page inside the safe area and every inset
        reports 0 — so the one rule in the app that read them,
        `max(env(safe-area-inset-top), 10px)`, had silently been a constant
        10px on every device since it was written. The app also could not paint
        to the physical edge of the screen, which is the first thing that reads
        as "web page in a browser" rather than "app".

        `maximum-scale`/`user-scalable` are deliberately NOT set: pinch-zoom is
        an accessibility feature and disabling it is a WCAG failure. The
        double-tap zoom delay is removed with `touch-action: manipulation` in
        theme.css instead, which costs nothing.
      -->
      <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      />
      <!-- Colours the Android status/URL bar to match the app instead of
           leaving a white strip above a navy screen. -->
      <meta name="theme-color" content="#060E1C" />
      <title>DrippleX — life, Simplified</title>
      <meta name="description" content="An all-in-one super app offering seamless ride-hailing, unified marketplace shopping, digital wallet, and merchant management for a simplified daily life." />
      <meta name="robots" content="noindex, nofollow" />

      <!--
        Fonts are linked here, not @import-ed from a stylesheet.

        They used to be pulled by `@import` from src/styles/fonts.css, which the
        browser can only discover after downloading and parsing index.css and
        then fonts.css — two round trips before the first byte of a font is
        requested. Until those land, every label renders in the fallback sans
        and then reflows, which is most of why the type looked soft.

        The preload scanner sees these <link>s in the first chunk of HTML, so
        the fonts start downloading immediately, in parallel with the CSS.

        Weights match what the app actually uses (400/500/600/700/800, plus
        Poppins 900 on the ride fare). Inter 700 was previously *not* loaded
        while ~295 elements asked for bold — the browser was faking those by
        smearing the 400 weight, which is exactly the blur it looks like.
      -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
