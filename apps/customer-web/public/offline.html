<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E7A3E" />
    <title>Offline · DrippleX</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --fg: #0a2540;
        --accent: #0e7a3e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a2540;
          --fg: #f4f6f8;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          Manrope,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        opacity: 0.85;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        padding: 0.75rem 1.25rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>DrippleX can’t reach the network right now. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
