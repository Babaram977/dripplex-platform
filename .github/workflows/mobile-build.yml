name: Mobile — Android Build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Capacitor remote URL (customer-web)'
        required: false
        default: 'https://app.dripplex.com'
      flavor:
        description: 'Android product flavor'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - closedBeta
  push:
    branches:
      - 'cursor/program-d4-mobile-packaging-1b33'
    paths:
      - 'apps/customer-mobile/**'
      - 'scripts/mobile/**'
      - '.github/workflows/mobile-build.yml'

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Mobile packaging verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Static mobile checks
        run: bash scripts/mobile/verify-mobile.sh

  android:
    name: Android AAB + APK (${{ inputs.flavor || 'production' }})
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      # Must match the Java version Capacitor 7 targets in
      # capacitor.build.gradle (21) — see mobile-store-readiness.yml.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/customer-mobile/android/release.keystore
      - name: Write keystore.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/customer-mobile/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
      - name: Build release artifacts
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || 'https://app.dripplex.com' }}
          ANDROID_FLAVOR: ${{ inputs.flavor || 'production' }}
        run: bash scripts/mobile/build-android.sh
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dripplex-customer-${{ inputs.flavor || 'production' }}-aab
          path: apps/customer-mobile/android/app/build/outputs/bundle/**/**/*.aab
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dripplex-customer-${{ inputs.flavor || 'production' }}-apk
          path: apps/customer-mobile/android/app/build/outputs/apk/**/**/*.apk
          if-no-files-found: warn

  ios-preflight:
    name: iOS project preflight
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode project files
        run: |
          test -f apps/customer-mobile/ios/App/App.xcodeproj/project.pbxproj
          test -f apps/customer-mobile/ios/App/App/PrivacyInfo.xcprivacy
          test -f apps/customer-mobile/ios/App/App/App.entitlements
          grep -q 'com.dripplex.customer' apps/customer-mobile/ios/App/App.xcodeproj/project.pbxproj
          echo "iOS scaffold OK (full archive requires macOS + signing)"
