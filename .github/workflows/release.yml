name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v version="$VERSION" '
            /^## \[/ {
              if ($0 ~ "\\[" version "\\]") { capture=1; next }
              if (capture) exit
            }
            capture { print }
          ' CHANGELOG.md)

          if [ -z "$SECTION" ]; then
            echo "No CHANGELOG section found for version $VERSION"
            exit 1
          fi

          {
            echo 'body<<EOF'
            echo "$SECTION"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Dripplex ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'foundation') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
