name: P1-B4 Evidence Gate

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        default: 'claude/dripplex-healthcheck-failure-6o3vb8'

jobs:
  p1-b4-evidence:
    name: P1-B4 Closure Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'claude/dripplex-healthcheck-failure-6o3vb8' }}

      - name: Capture repository state
        id: repo_state
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          git log --oneline -10 > /tmp/recent_commits.txt
          cat /tmp/recent_commits.txt
          echo "=== Commit Message ===" >> /tmp/recent_commits.txt
          git log -1 --pretty=%B >> /tmp/recent_commits.txt

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure workspace package links
        run: |
          # Create symlinks for workspace packages if they don't exist
          mkdir -p node_modules/@dripplex
          [ -L node_modules/@dripplex/types ] || ln -s ../../packages/types node_modules/@dripplex/types
          [ -L node_modules/@dripplex/config ] || ln -s ../../packages/config node_modules/@dripplex/config
          [ -L node_modules/@dripplex/utils ] || ln -s ../../packages/utils node_modules/@dripplex/utils
          [ -L node_modules/@dripplex/sdk ] || ln -s ../../packages/sdk node_modules/@dripplex/sdk
          [ -L node_modules/@dripplex/ui ] || ln -s ../../packages/ui node_modules/@dripplex/ui
          [ -L node_modules/@dripplex/hooks ] || ln -s ../../packages/hooks node_modules/@dripplex/hooks
          # Verify links
          ls -la node_modules/@dripplex/ | grep -E "types|config|utils|sdk|ui|hooks"

      - name: Setup PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS dripplex_test;"
          psql -h localhost -U postgres -c "DROP USER IF EXISTS dripplex_test_user;"
          psql -h localhost -U postgres -c "CREATE DATABASE dripplex_test;"
          psql -h localhost -U postgres -c "CREATE USER dripplex_test_user WITH PASSWORD 'dripplex_test_pass';"
          psql -h localhost -U postgres -c "ALTER DATABASE dripplex_test OWNER TO dripplex_test_user;"
          echo "PostgreSQL setup complete"

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://dripplex_test_user:dripplex_test_pass@localhost:5432/dripplex_test
        run: |
          set -o pipefail
          cd apps/backend
          echo "=== PRISMA MIGRATION START ===" >> ../../p1-b4-actual-results.log
          npx prisma migrate deploy 2>&1 | tee -a ../../p1-b4-actual-results.log
          MIGRATION_EXIT=${PIPESTATUS[0]}
          if [ $MIGRATION_EXIT -ne 0 ]; then
            echo "Migration failed (exit code: $MIGRATION_EXIT)" >> ../../p1-b4-actual-results.log
            exit 1
          fi
          echo "=== PRISMA MIGRATION SUCCESS ===" >> ../../p1-b4-actual-results.log

      - name: Lint and typecheck
        run: |
          set -o pipefail
          echo "=== BUILD/LINT/TYPECHECK START ===" >> p1-b4-actual-results.log
          # Use turbo to build with proper dependency ordering
          # turbo.json specifies: build depends on ^build (dependencies build first)
          pnpm exec turbo run build --filter=@dripplex/backend 2>&1 | tee -a p1-b4-actual-results.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Build/lint failed (exit code: $BUILD_EXIT)" >> p1-b4-actual-results.log
            exit 1
          fi
          echo "=== BUILD/LINT/TYPECHECK SUCCESS ===" >> p1-b4-actual-results.log

      - name: Run P1-B4 Repository Tests
        env:
          DATABASE_URL: postgresql://dripplex_test_user:dripplex_test_pass@localhost:5432/dripplex_test
        run: |
          set -o pipefail
          cd apps/backend
          echo "=== P1-B4 REPOSITORY TESTS START ===" >> ../../p1-b4-actual-results.log
          npm test -- repositories/prisma-audit-segment.repository.spec.ts --testTimeout=30000 2>&1 | tee -a ../../p1-b4-actual-results.log
          REPO_TEST_EXIT=${PIPESTATUS[0]}
          echo "=== P1-B4 REPOSITORY TESTS EXIT CODE: $REPO_TEST_EXIT ===" >> ../../p1-b4-actual-results.log
          if [ $REPO_TEST_EXIT -ne 0 ]; then
            echo "Repository tests failed" >> ../../p1-b4-actual-results.log
            exit 1
          fi

      - name: Run AuditService Tests (includes P1-B4 closeActiveSegment)
        env:
          DATABASE_URL: postgresql://dripplex_test_user:dripplex_test_pass@localhost:5432/dripplex_test
        run: |
          set -o pipefail
          cd apps/backend
          echo "=== AUDIT SERVICE TESTS START ===" >> ../../p1-b4-actual-results.log
          npm test -- audit.service.spec.ts --testTimeout=30000 2>&1 | tee -a ../../p1-b4-actual-results.log
          SERVICE_TEST_EXIT=${PIPESTATUS[0]}
          echo "=== AUDIT SERVICE TESTS EXIT CODE: $SERVICE_TEST_EXIT ===" >> ../../p1-b4-actual-results.log
          if [ $SERVICE_TEST_EXIT -ne 0 ]; then
            echo "Service tests failed" >> ../../p1-b4-actual-results.log
            exit 1
          fi

      - name: Run SegmentAuthorityService Tests
        env:
          DATABASE_URL: postgresql://dripplex_test_user:dripplex_test_pass@localhost:5432/dripplex_test
        continue-on-error: true
        id: segment_auth_tests
        run: |
          set -o pipefail
          cd apps/backend
          echo "=== SEGMENT AUTHORITY SERVICE TESTS START ===" >> ../../p1-b4-actual-results.log
          npm test -- segment-authority.service.spec.ts --testTimeout=30000 2>&1 | tee -a ../../p1-b4-actual-results.log
          SEGMENT_AUTH_EXIT=${PIPESTATUS[0]}
          echo "=== SEGMENT AUTHORITY SERVICE TESTS EXIT CODE: $SEGMENT_AUTH_EXIT ===" >> ../../p1-b4-actual-results.log
          echo "exit_code=$SEGMENT_AUTH_EXIT" >> $GITHUB_OUTPUT

      - name: Verify SegmentAuthorityService test failures
        if: steps.segment_auth_tests.outputs.exit_code != '0'
        run: |
          cd apps/backend
          echo "=== SEGMENT AUTHORITY TESTS FAILED - ANALYSIS ===" >> ../../p1-b4-actual-results.log
          echo "Investigating which tests failed and relationship to B4..." >> ../../p1-b4-actual-results.log
          npm test -- segment-authority.service.spec.ts --testTimeout=30000 --verbose 2>&1 | grep -A 5 "●" >> ../../p1-b4-actual-results.log
          echo "Note: Failures above must be evaluated for B4 impact" >> ../../p1-b4-actual-results.log

      - name: Verify Repository State
        env:
          DATABASE_URL: postgresql://dripplex_test_user:dripplex_test_pass@localhost:5432/dripplex_test
        run: |
          cd apps/backend
          echo "=== REPOSITORY STATE VERIFICATION ===" >> ../../p1-b4-actual-results.log
          echo "HEAD SHA: ${{ steps.repo_state.outputs.HEAD_SHA }}" >> ../../p1-b4-actual-results.log
          echo "Branch: ${{ steps.repo_state.outputs.BRANCH }}" >> ../../p1-b4-actual-results.log
          echo "P1-B4 commits present:" >> ../../p1-b4-actual-results.log
          git log --oneline | grep -E "P1-B4|Implement Segment Closure|Fix segment repository" >> ../../p1-b4-actual-results.log

      - name: Capture environment details
        run: |
          echo "=== ENVIRONMENT DETAILS ===" >> p1-b4-actual-results.log
          echo "PostgreSQL version:" >> p1-b4-actual-results.log
          psql --version >> p1-b4-actual-results.log
          echo "Redis running in service (redis-cli not on runner)" >> p1-b4-actual-results.log
          echo "Node version:" >> p1-b4-actual-results.log
          node --version >> p1-b4-actual-results.log
          echo "npm version:" >> p1-b4-actual-results.log
          npm --version >> p1-b4-actual-results.log
          echo "Prisma version:" >> p1-b4-actual-results.log
          cd apps/backend && npx prisma --version >> ../../p1-b4-actual-results.log

      - name: Add B4 Evidence Markers
        if: steps.segment_auth_tests.outputs.exit_code == '0'
        run: |
          echo "" >> p1-b4-actual-results.log
          echo "=== B4 EVIDENCE GATE VERIFICATION ===" >> p1-b4-actual-results.log
          echo "Tested HEAD SHA: ${{ steps.repo_state.outputs.HEAD_SHA }}" >> p1-b4-actual-results.log
          echo "Tested Branch: ${{ steps.repo_state.outputs.BRANCH }}" >> p1-b4-actual-results.log
          echo "ALL B4 TESTS PASSED" >> p1-b4-actual-results.log
          echo "P1-B4 Segment Closure: PASS" >> p1-b4-actual-results.log
          echo "Evidence generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> p1-b4-actual-results.log

      - name: Record B4 Evidence Gate Status
        run: |
          if [ "${{ steps.segment_auth_tests.outputs.exit_code }}" == "0" ]; then
            echo "✅ B4 Evidence Gate: ALL TESTS PASSED"
            echo "Gate status: PASS" >> p1-b4-actual-results.log
          else
            echo "❌ B4 Evidence Gate: FAILURES DETECTED"
            echo "Segment Authority Service tests failed with exit code: ${{ steps.segment_auth_tests.outputs.exit_code }}" >> p1-b4-actual-results.log
            echo "Gate status: FAIL" >> p1-b4-actual-results.log
          fi

      - name: Verify evidence file integrity
        run: |
          echo "=== Evidence File Contents (last 30 lines) ==="
          tail -30 p1-b4-actual-results.log
          echo ""
          echo "=== Evidence File Integrity Check ==="
          if grep -q "REPOSITORY TESTS EXIT CODE:" p1-b4-actual-results.log; then
            echo "✅ Repository tests executed"
          fi
          if grep -q "AUDIT SERVICE TESTS EXIT CODE:" p1-b4-actual-results.log; then
            echo "✅ Audit Service tests executed"
          fi
          if grep -q "SEGMENT AUTHORITY SERVICE TESTS EXIT CODE:" p1-b4-actual-results.log; then
            echo "✅ Segment Authority Service tests executed"
          fi

      - name: Report final status
        if: always()
        run: |
          echo "" >> p1-b4-actual-results.log
          echo "=== P1-B4 CI EVIDENCE GATE FINAL REPORT ===" >> p1-b4-actual-results.log
          echo "Workflow Run: ${{ github.run_id }}" >> p1-b4-actual-results.log
          echo "Job ID: ${{ github.job }}" >> p1-b4-actual-results.log
          echo "Tested SHA: ${{ steps.repo_state.outputs.HEAD_SHA }}" >> p1-b4-actual-results.log
          if [ "${{ steps.segment_auth_tests.outputs.exit_code }}" == "0" ]; then
            echo "Status: Evidence Gate PASSED" >> p1-b4-actual-results.log
          else
            echo "Status: Evidence Gate FAILED - See test output above" >> p1-b4-actual-results.log
          fi
          echo "Report timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> p1-b4-actual-results.log

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-b4-closure-evidence
          path: p1-b4-actual-results.log
          retention-days: 90
          if-no-files-found: error
