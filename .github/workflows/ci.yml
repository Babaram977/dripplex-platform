name: CI — Pull Request Validation

on:
  # No `branches:` filter here, deliberately.
  #
  # Scoped to [main, 'cursor/**'], this workflow ran on a pull request only when
  # its *base* was one of those branches — so a PR stacked on another PR got no
  # typecheck, no lint, no tests and no build. Not a red X: no run at all, which
  # reads as "nothing to report" rather than "nothing was checked". #296 was
  # opened against a feature branch and showed only the mobile jobs, which is how
  # this was found.
  #
  # Every pull request is now validated, whatever it targets. The `push` trigger
  # below keeps its filter, so a feature branch does not also burn a full 45-minute
  # run on every push — the pull_request event already covers it.
  pull_request:
  push:
    branches: [main, 'cursor/**']
  workflow_call:

# KNOWN LIMITATION, recorded rather than papered over: re-targeting an existing
# pull request (which is what GitHub does automatically when the branch it was
# stacked on merges) fires `pull_request: edited`, and that is not one of the
# default activity types, so it does not start a new run. The run you are looking
# at then validated the head against its *old* base.
#
# Adding `types: [..., edited]` was considered and rejected: `edited` also fires
# on every title and description edit, which would spend 45 minutes of CI on a
# typo fix, and skipping those runs with a job-level `if` makes the check report
# as "skipped", which branch protection can treat as unmet.
#
# So this stays a convention instead: before merging a PR that was stacked,
# bring its head up to date with the new base (merge or rebase). That fires
# `synchronize`, which does start a run — against the base it will actually
# merge into.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Real PostgreSQL so the backend's DB-backed integration specs actually run.
    # Without this the specs early-return (databaseAvailable=false) and pass
    # vacuously; the jest globalSetup below fails the run if this DB is missing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dripplex
          POSTGRES_PASSWORD: dripplex
          POSTGRES_DB: dripplex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dripplex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real Redis for the same reason. Specs that boot the whole AppModule
      # (moduleRef.init(), not just compile()) start RedisService, whose
      # onModuleInit awaits a connection that ioredis retries forever — with no
      # Redis here the run does not fail, it *hangs* until the 45-minute job
      # timeout, which reads as an infrastructure flake rather than a missing
      # service. The guard in jest-global-setup now names it in seconds.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # GitHub Actions sets CI=true, which arms the DB-integrity globalSetup.
      DATABASE_URL: postgresql://dripplex:dripplex@localhost:5432/dripplex?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Apply database migrations
        run: pnpm --filter @dripplex/backend exec prisma migrate deploy
      - name: Unit & integration tests (real Postgres)
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3001

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Dependency audit (prod, high+)
        run: pnpm audit --prod --audit-level=high
      - name: Script syntax check
        run: |
          for f in scripts/cicd/*.sh scripts/mobile/*.sh scripts/golive/*.sh; do
            bash -n "$f"
            echo "OK $f"
          done
      - name: Mobile packaging verify
        run: bash scripts/mobile/verify-mobile.sh
      - name: Assert v1.0.0 manifest matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./docs/releases/v1.0.0.json').version")
          echo "package=$PKG manifest=$MAN"
          test "$PKG" = "$MAN"
          test "$PKG" = "1.0.0"

  docker-dry:
    name: Dockerfiles present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Dockerfiles
        run: |
          test -f apps/backend/Dockerfile
          test -f apps/customer-web/Dockerfile
          test -f apps/merchant-portal/Dockerfile
          test -f apps/rider-portal/Dockerfile
          test -f apps/super-app/Dockerfile
          test -f infrastructure/docker/docker-bake.hcl
          echo "Docker image sources OK"

      # Actually build the image that serves app.dripplex.com.
      #
      # `test -f` was the whole of this job, and it is why nobody noticed that
      # every super-app deploy failed for twelve hours on 2026-08-27. A
      # Dockerfile copies a subset of the workspace; the repo-root `pnpm build`
      # has all of it on disk and cannot see what the subset leaves out. So the
      # only thing that gates a deploy is building it the way Railway does.
      #
      # super-app specifically because it is the one whose Dockerfile hides a
      # partial COPY of packages/, and the one a stale deploy hurts most: the
      # Android shell loads its UI from this origin, so a failed build here
      # freezes the app on every phone without failing anything visible.
      - name: Build the super-app image the way Railway does
        run: docker build -f apps/super-app/Dockerfile -t dripplex-super-app:ci .

      # `docker build` never runs CMD. It proves the image assembles and that
      # `pnpm install --prod` resolved the runtime deps — and nothing about
      # whether the thing it is told to start actually starts. A server.mjs that
      # throws on boot passes the step above, green.
      #
      # So: run the container and ask it for the paths that matter.
      - name: Smoke-test the super-app container
        run: |
          set -euo pipefail
          docker run -d --name dpx-super-app -p 3000:3000 dripplex-super-app:ci

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then break; fi
            if [ "$i" = 30 ]; then
              echo "::error::super-app container never answered on :3000"
              docker logs dpx-super-app || true
              exit 1
            fi
            sleep 1
          done

          # Deliberately plain. A clever condition here fails open, and failing
          # open is the whole category of bug this job exists to catch.
          check() { # path expected_status expected_content_type_prefix
            path=$1; want_code=$2; want_type=$3
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "http://localhost:3000$path")
            ctype=$(curl -sSI "http://localhost:3000$path" | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2}')
            echo "  $path -> $code $ctype"
            bad=0
            [ "$code" = "$want_code" ] || bad=1
            case "$ctype" in "$want_type"*) ;; *) bad=1;; esac
            if [ "$bad" = 1 ]; then
              echo "::error::$path expected $want_code $want_type, got $code $ctype"
              head -c 300 /tmp/body; echo
              docker logs dpx-super-app || true
              exit 1
            fi
          }

          echo "SPA still serves (serve-handler delegation intact):"
          check / 200 text/html

          echo "Android assetlinks.json unaffected:"
          check /.well-known/assetlinks.json 200 application/json

          # The path `serve` could not serve. Apple requires exactly this
          # extensionless name, as application/json, with no redirect.
          echo "AASA served as JSON, not the SPA:"
          check /.well-known/apple-app-site-association 200 application/json

          # Content, not just status. A 200 carrying the wrong Team ID is a
          # Universal Link that silently never opens the app.
          cat /tmp/body; echo
          if grep -q '<html' /tmp/body; then
            echo "::error::AASA returned HTML — the SPA swallowed the route"; exit 1
          fi
          if ! grep -q 'X9MCF93WB7.com.dripplex.customer' /tmp/body; then
            echo "::error::AASA does not name X9MCF93WB7.com.dripplex.customer"; exit 1
          fi

          docker rm -f dpx-super-app

      # The 200 above proves the file is served. It cannot prove the absent-file
      # branch still 404s rather than falling through to the SPA — and that
      # branch is what keeps a future missing file visible instead of silent.
      - name: Smoke-test the absent-AASA branch
        run: |
          set -euo pipefail
          cat > /tmp/no-aasa.Dockerfile <<'DOCKERFILE'
          FROM dripplex-super-app:ci
          RUN rm -f dist/.well-known/apple-app-site-association
          DOCKERFILE
          docker build -f /tmp/no-aasa.Dockerfile -t dripplex-super-app:ci-no-aasa /tmp
          docker run -d --name dpx-no-aasa -p 3001:3000 dripplex-super-app:ci-no-aasa

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3001/; then break; fi
            if [ "$i" = 30 ]; then
              echo "::error::container never answered on :3001"
              docker logs dpx-no-aasa || true
              exit 1
            fi
            sleep 1
          done

          code=$(curl -sS -o /tmp/no.body -w '%{http_code}' http://localhost:3001/.well-known/apple-app-site-association)
          ctype=$(curl -sSI http://localhost:3001/.well-known/apple-app-site-association | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2}')
          echo "  AASA removed -> $code $ctype"
          head -c 200 /tmp/no.body; echo

          # An honest 404 is debuggable. `serve` returned the SPA under a 200
          # here, which is the failure this whole change exists to remove.
          if [ "$code" != 404 ]; then echo "::error::absent AASA gave $code, expected 404"; exit 1; fi
          case "$ctype" in application/json*) ;; *) echo "::error::absent-AASA content-type is $ctype, expected application/json"; exit 1;; esac
          if grep -q '<html' /tmp/no.body; then echo "::error::absent AASA fell through to the SPA"; exit 1; fi

          docker rm -f dpx-no-aasa
