name: CI — Pull Request Validation

on:
  pull_request:
    branches: [main, 'cursor/**']
  push:
    branches: [main, 'cursor/**']
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3001

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Dependency audit (prod, high+)
        run: pnpm audit --prod --audit-level=high
      - name: Script syntax check
        run: |
          for f in scripts/cicd/*.sh; do
            bash -n "$f"
            echo "OK $f"
          done

  docker-dry:
    name: Dockerfiles present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Dockerfiles
        run: |
          test -f apps/backend/Dockerfile
          test -f apps/customer-web/Dockerfile
          test -f apps/merchant-portal/Dockerfile
          test -f apps/rider-portal/Dockerfile
          test -f apps/admin-portal/Dockerfile
          test -f infrastructure/docker/docker-bake.hcl
          echo "Docker image sources OK"
