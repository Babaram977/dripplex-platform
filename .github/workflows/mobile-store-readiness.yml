name: Mobile — Store Readiness

on:
  pull_request:
    paths:
      - 'apps/customer-mobile/**'
      - 'apps/customer-web/**'
      - 'scripts/mobile/**'
      - '.github/workflows/mobile-store-readiness.yml'
  push:
    branches:
      - main
      - 'agent/dpx-store-readiness'
    paths:
      - 'apps/customer-mobile/**'
      - 'apps/customer-web/**'
      - 'scripts/mobile/**'
      - '.github/workflows/mobile-store-readiness.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Capacitor remote URL used by the release shell'
        required: false
        default: 'https://app.dripplex.com'

env:
  CAPACITOR_SERVER_URL: ${{ inputs.server_url || 'https://app.dripplex.com' }}

concurrency:
  group: mobile-store-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static store preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run mobile packaging checks
        run: bash scripts/mobile/verify-mobile.sh
      - name: Verify native brand assets
        run: pnpm --filter @dripplex/customer-mobile icons:verify
      - name: Assert brand assets match the master vector
        run: |
          pnpm --filter @dripplex/customer-mobile icons:generate
          if ! git diff --quiet -- apps/customer-mobile; then
            echo "::error::Native brand assets differ from what resources/dripplex-mark.svg generates."
            echo "Run 'pnpm --filter @dripplex/customer-mobile icons:generate' and commit the result."
            git --no-pager diff --stat -- apps/customer-mobile
            exit 1
          fi

  android:
    name: Android release build
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 45
    # Job level, NOT step level — a step's `if` is evaluated before that step's
    # own `env` exists, so the two signing steps below were skipped on every
    # run. Observed, not theorised: run 32567966317 skipped both and still went
    # green with an unsigned bundle uploaded as an artifact.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Job level for the same reason the keystore is: a step's `if` is
      # evaluated before that step's own `env` exists.
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      # Capacitor 7 generates capacitor.build.gradle with
      # sourceCompatibility/targetCompatibility JavaVersion.VERSION_21, so a
      # JDK 17 toolchain fails the Android build with
      # "error: invalid source release: 21" in
      # :capacitor-android:compileReleaseJavaWithJavac.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Restore Android signing material
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/customer-mobile/android/release.keystore
      - name: Write keystore properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/customer-mobile/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
      # DPX-MOBILE-001. #293 added this to mobile-build.yml — and only there.
      # **This** workflow is the one that produces the artifact people install
      # on a device, so without it the tested APK could not obtain an FCM token
      # and no push arrived, while the build went green and said so in a single
      # line nobody read:
      #
      #   NO FCM: no google-services resources generated — push is inert
      #
      # Two workflows building the same app, one of them push-capable, is how a
      # driver ends up testing a build that was never going to ring.
      #
      # Accepts the secret base64-encoded or as raw JSON: the secret's job is to
      # deliver one file, and whether it was piped through `base64` on the way
      # in is incidental. Pasting the raw file is an easy mistake, especially
      # from a phone.
      - name: Decode google-services.json
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          set -euo pipefail
          TARGET=apps/customer-mobile/android/app/google-services.json

          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$TARGET" 2>/dev/null; then
            echo "Secret decoded as base64."
          elif printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | grep -q '^[[:space:]]*{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" > "$TARGET"
            echo "Secret was raw JSON, not base64 — written directly."
          else
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is neither valid base64 nor JSON."
            echo "The secret must be either the contents of google-services.json," >&2
            echo "or that file base64-encoded (base64 -w 0 google-services.json)." >&2
            exit 1
          fi

          PARSE_ERROR=$(node -e "
            const fs = require('node:fs');
            try { JSON.parse(fs.readFileSync('$TARGET', 'utf8')); }
            catch (error) { process.stdout.write(error.message); }
          ")
          if [[ -n "$PARSE_ERROR" ]]; then
            echo "::error::google-services.json is not valid JSON: ${PARSE_ERROR}"
            echo "The secret is almost certainly truncated — it survived $(wc -c < "$TARGET") bytes." >&2
            exit 1
          fi
          echo "google-services.json written and parses ($(wc -c < "$TARGET") bytes)."

      - name: Build production AAB and APK
        env:
          ANDROID_FLAVOR: production
          # Fail rather than upload a push-less artifact. This is a release
          # build that gets installed on a real handset to decide whether the
          # app is submittable; "green but inert" is the worst possible
          # outcome, because it is indistinguishable from working until a
          # driver misses a job.
          REQUIRE_PUSH: '1'
        run: bash scripts/mobile/build-android.sh
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dripplex-customer-android-store-readiness
          path: |
            apps/customer-mobile/android/app/build/outputs/bundle/productionRelease/**/*.aab
            apps/customer-mobile/android/app/build/outputs/apk/production/release/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator release build
    runs-on: macos-latest
    needs: static
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Sync Capacitor iOS project
        env:
          CAPACITOR_SERVER_URL: ${{ env.CAPACITOR_SERVER_URL }}
        run: pnpm --filter @dripplex/customer-mobile exec cap sync ios
      - name: Build iOS Release without signing
        working-directory: apps/customer-mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
