name: Mobile — Store Readiness

on:
  pull_request:
    paths:
      - 'apps/customer-mobile/**'
      - 'apps/customer-web/**'
      - 'scripts/mobile/**'
      - '.github/workflows/mobile-store-readiness.yml'
  push:
    branches:
      - main
      - 'agent/dpx-store-readiness'
    paths:
      - 'apps/customer-mobile/**'
      - 'apps/customer-web/**'
      - 'scripts/mobile/**'
      - '.github/workflows/mobile-store-readiness.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Capacitor remote URL used by the release shell'
        required: false
        default: 'https://app.dripplex.com'

env:
  CAPACITOR_SERVER_URL: ${{ inputs.server_url || 'https://app.dripplex.com' }}

concurrency:
  group: mobile-store-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static store preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run mobile packaging checks
        run: bash scripts/mobile/verify-mobile.sh

  android:
    name: Android release build
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      # Capacitor 7 generates capacitor.build.gradle with
      # sourceCompatibility/targetCompatibility JavaVersion.VERSION_21, so a
      # JDK 17 toolchain fails the Android build with
      # "error: invalid source release: 21" in
      # :capacitor-android:compileReleaseJavaWithJavac.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Restore Android signing material
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/customer-mobile/android/release.keystore
      - name: Write keystore properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/customer-mobile/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
      - name: Build production AAB and APK
        env:
          ANDROID_FLAVOR: production
        run: bash scripts/mobile/build-android.sh
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dripplex-customer-android-store-readiness
          path: |
            apps/customer-mobile/android/app/build/outputs/bundle/productionRelease/**/*.aab
            apps/customer-mobile/android/app/build/outputs/apk/production/release/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator release build
    runs-on: macos-latest
    needs: static
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Sync Capacitor iOS project
        env:
          CAPACITOR_SERVER_URL: ${{ env.CAPACITOR_SERVER_URL }}
        run: pnpm --filter @dripplex/customer-mobile exec cap sync ios
      - name: Build iOS Release without signing
        working-directory: apps/customer-mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
