# Deploy all OpenNext portals to Cloudflare Workers (production).
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Scripts Edit + Account Settings Read + Zone DNS Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id
#   CLOUDFLARE_ZONE_ID    — dripplex.com zone id (optional; custom domains use wrangler routes)
name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated apps (default: all portals)'
        required: false
        default: 'customer-web,merchant-portal,rider-portal,admin-portal,operations-console'
      confirm:
        description: 'Type deploy-production to confirm'
        required: true
        type: string
  # Cloud agents cannot workflow_dispatch (token 403). Touch this file on main to deploy.
  push:
    branches: [main]
    paths:
      - '.github/trigger-cf-workers-deploy'

concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy Workers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.confirm == 'deploy-production'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PROD_API_BASE_URL || 'https://api.dripplex.com/api/v1' }}
      DEPLOY_APPS: ${{ github.event.inputs.apps || 'customer-web,merchant-portal,rider-portal,admin-portal,operations-console' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing — cannot deploy."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is missing — cannot deploy."
            exit 1
          fi
          echo "CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:+set}"
          npx wrangler whoami

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy selected apps
        run: |
          set -euo pipefail
          IFS=',' read -ra APPS <<< "${DEPLOY_APPS}"
          for app in "${APPS[@]}"; do
            app="$(echo "$app" | xargs)"
            echo "::group::Deploy $app"
            case "$app" in
              customer-web) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_CUSTOMER_URL || 'https://www.dripplex.com' }}" ;;
              merchant-portal) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_MERCHANT_URL || 'https://merchant.dripplex.com' }}" ;;
              rider-portal) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_RIDER_URL || 'https://rider.dripplex.com' }}" ;;
              admin-portal) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_ADMIN_URL || 'https://admin.dripplex.com' }}" ;;
              operations-console) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_OPS_URL || 'https://ops.dripplex.com' }}" ;;
            esac
            bash "apps/${app}/scripts/cf-build.sh"
            (cd "apps/${app}" && npx wrangler deploy)
            echo "::endgroup::"
          done

      - name: Probe custom domains
        if: always()
        run: |
          set +e
          echo "## Live URL probe" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | HTTP |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for u in \
            https://dripplex.com \
            https://www.dripplex.com \
            https://app.dripplex.com \
            https://merchant.dripplex.com \
            https://rider.dripplex.com \
            https://admin.dripplex.com \
            https://ops.dripplex.com
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo 000)
            echo "$code $u"
            echo "| \`$u\` | $code |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Delete obsolete dripplex-platform worker
        continue-on-error: true
        run: |
          npx wrangler delete dripplex-platform --force || echo "Obsolete worker not present or delete skipped"
