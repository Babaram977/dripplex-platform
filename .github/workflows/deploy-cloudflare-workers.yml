# Deploy all OpenNext portals to Cloudflare Workers (production).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID
name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated apps (default: all portals)'
        required: false
        default: 'customer-web,merchant-portal,rider-portal,admin-portal,operations-console'
      confirm:
        description: 'Type deploy-production to confirm'
        required: true
        type: string
      attach_domains:
        description: 'Attempt custom domain attach after deploy (true/false)'
        required: false
        default: 'true'
  # Auto-deploy on merge to main.
  #
  # These Workers ARE the public portals — admin/merchant/rider/www and the ops
  # console. Railway auto-deploys on merge but serves different hostnames, so
  # while this pipeline only ran when someone remembered to trigger it, merged
  # work simply never reached users: on 2026-08-26 the last run was 2026-08-11,
  # and roughly PR #106 through #280 had been sitting unpublished for 15 days
  # with every dashboard reporting success.
  #
  # Path-filtered so a backend-only merge does not spend ~20 minutes rebuilding
  # five frontends. `packages/**` is included without narrowing: every portal
  # transpiles @dripplex/ui, hooks, types, utils, sdk and config, so a change to
  # any of them can change any portal's output.
  push:
    branches: [main]
    paths:
      - 'apps/customer-web/**'
      - 'apps/merchant-portal/**'
      - 'apps/rider-portal/**'
      - 'apps/admin-portal/**'
      - 'apps/operations-console/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-cloudflare-workers.yml'
      - '.github/trigger-cf-workers-deploy'

# Deploys queue rather than cancel. `cancel-in-progress: true` would kill a run
# mid-loop, and the loop deploys the five portals one at a time — so a cancelled
# run leaves some portals on the new build and some on the old, which is a worse
# state than simply waiting.
concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy Workers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.confirm == 'deploy-production'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PROD_API_BASE_URL || 'https://api.dripplex.com/api/v1' }}
      DEPLOY_APPS: ${{ github.event.inputs.apps || 'customer-web,merchant-portal,rider-portal,admin-portal,operations-console' }}
      ATTACH_DOMAINS: ${{ github.event.inputs.attach_domains || 'true' }}
      WORKERS_DEV_SUBDOMAIN: danwakili
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing — cannot deploy."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is missing — cannot deploy."
            exit 1
          fi
          echo "CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:+set}"
          npx wrangler whoami

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy selected apps
        run: |
          set -euo pipefail
          IFS=',' read -ra APPS <<< "${DEPLOY_APPS}"
          for app in "${APPS[@]}"; do
            app="$(echo "$app" | xargs)"
            echo "::group::Deploy $app"
            case "$app" in
              customer-web) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_CUSTOMER_URL || 'https://www.dripplex.com' }}" ;;
              merchant-portal) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_MERCHANT_URL || 'https://merchant.dripplex.com' }}" ;;
              rider-portal) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_RIDER_URL || 'https://rider.dripplex.com' }}" ;;
              admin-portal) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_ADMIN_URL || 'https://admin.dripplex.com' }}" ;;
              operations-console) export NEXT_PUBLIC_APP_URL="${{ vars.PROD_OPS_URL || 'https://ops.dripplex.com' }}" ;;
            esac
            bash "apps/${app}/scripts/cf-build.sh"
            (cd "apps/${app}" && npx wrangler deploy)
            echo "::endgroup::"
          done

      - name: Attach custom domains (best effort)
        if: env.ATTACH_DOMAINS == 'true'
        continue-on-error: true
        run: |
          set +e
          CF_API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          delete_conflicting_dns() {
            local hostname="$1"
            echo "Clearing conflicting DNS for ${hostname}"
            # List A/AAAA/CNAME for this name
            records=$(curl -sS "${CF_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${hostname}&per_page=100" "${AUTH[@]}")
            echo "$records" | head -c 1500; echo
            ids=$(echo "$records" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(r['id'] for r in d.get('result',[]) if r.get('type') in ('A','AAAA','CNAME')))")
            for id in $ids; do
              echo "Deleting DNS record ${id}"
              curl -sS -X DELETE "${CF_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}" "${AUTH[@]}"
              echo
            done
          }

          attach() {
            local script="$1"
            local hostname="$2"
            echo "Attaching ${hostname} → ${script}"
            resp=$(curl -sS -X PUT \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              "${AUTH[@]}" \
              --data "{\"hostname\":\"${hostname}\",\"service\":\"${script}\",\"environment\":\"production\",\"zone_id\":\"${CLOUDFLARE_ZONE_ID}\"}")
            echo "$resp" | head -c 2000
            echo
          }

          # ── Only hostnames still served by Cloudflare Workers belong here ──
          #
          # dripplex.com, www.dripplex.com, app.dripplex.com and ops.dripplex.com
          # were migrated to Railway on 2026-08-22 and MUST NOT be listed. Both
          # helpers above are destructive to a migrated host:
          #
          #   delete_conflicting_dns  deletes the A/AAAA/CNAME records the
          #                           migration created — including the CNAME
          #                           pointing at Railway's per-domain edge
          #   attach                  re-binds the hostname to a Worker, which
          #                           takes precedence and is invisible in the
          #                           Cloudflare DNS tab
          #
          # The two lines removed from here were exactly that pair aimed at the
          # apex and www. Running them now silently reverts the migration: the
          # Railway CNAME disappears, the certificate stops renewing, and the
          # host serves whatever stale build the Worker last deployed. The apex
          # is the account-deletion URL Google Play requires, so that revert
          # would also break the store listing.
          #
          # Adding a host back here is only correct if it is genuinely being
          # moved back to Workers. Check what serves it first:
          #   curl -sI https://<host>/ | grep -i '^server:'
          #   railway-hikari -> Railway, leave it out.  cloudflare -> Workers.
          attach dripplex-merchant merchant.dripplex.com
          attach dripplex-rider rider.dripplex.com
          attach dripplex-admin admin.dripplex.com
          exit 0

      # Only probe when the deploy actually ran.
      #
      # Under `if: always()` this step ran even when the deploy was skipped, and
      # then reported HTTP 200 for all twelve URLs — because the PREVIOUS
      # deployment was still up and answering. On 2026-08-26 a run whose
      # credentials gate had failed still produced a summary table of twelve
      # green 200s. A probe that passes hardest when nothing was deployed is
      # worse than no probe: it reads as confirmation.
      #
      # `success()` means the table now only appears when there is a new
      # deployment for it to describe. The run's own conclusion reports failure.
      - name: Probe Workers + custom domains
        if: success()
        run: |
          set +e
          {
            echo "## Live URL probe"
            echo "| URL | HTTP |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for u in \
            https://dripplex-customer-web.${WORKERS_DEV_SUBDOMAIN}.workers.dev \
            https://dripplex-merchant.${WORKERS_DEV_SUBDOMAIN}.workers.dev \
            https://dripplex-rider.${WORKERS_DEV_SUBDOMAIN}.workers.dev \
            https://dripplex-admin.${WORKERS_DEV_SUBDOMAIN}.workers.dev \
            https://dripplex-ops.${WORKERS_DEV_SUBDOMAIN}.workers.dev \
            https://dripplex.com \
            https://www.dripplex.com \
            https://app.dripplex.com \
            https://merchant.dripplex.com \
            https://rider.dripplex.com \
            https://admin.dripplex.com \
            https://ops.dripplex.com
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo 000)
            echo "$code $u"
            echo "| \`$u\` | $code |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Delete obsolete dripplex-platform worker
        continue-on-error: true
        run: |
          npx wrangler delete dripplex-platform --force || echo "Obsolete worker not present or delete skipped"
