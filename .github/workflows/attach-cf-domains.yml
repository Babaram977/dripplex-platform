# Attach / repair custom domains for already-deployed Workers (no rebuild).
name: Attach Cloudflare Domains

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-cf-domains-attach'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach:
    name: Clear conflicting DNS + attach domains
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Attach domains
        run: |
          set -euo pipefail
          CF_API="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          delete_conflicting_dns() {
            local hostname="$1"
            echo "::group::Clear DNS ${hostname}"
            records=$(curl -sS "${CF_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${hostname}&per_page=100" "${auth[@]}")
            echo "$records"
            mapfile -t ids < <(echo "$records" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\\n'.join(r['id'] for r in d.get('result',[]) if r.get('type') in ('A','AAAA','CNAME')))")
            for id in "${ids[@]:-}"; do
              [[ -z "$id" ]] && continue
              echo "Deleting ${id}"
              curl -sS -X DELETE "${CF_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}" "${auth[@]}"
              echo
            done
            echo "::endgroup::"
          }

          attach() {
            local script="$1" hostname="$2"
            echo "::group::Attach ${hostname} → ${script}"
            curl -sS -X PUT \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              "${auth[@]}" \
              --data "{\"hostname\":\"${hostname}\",\"service\":\"${script}\",\"environment\":\"production\",\"zone_id\":\"${CLOUDFLARE_ZONE_ID}\"}"
            echo
            echo "::endgroup::"
          }

          # ── Only hostnames still served by Cloudflare Workers belong here ──
          #
          # dripplex.com, www.dripplex.com, app.dripplex.com and ops.dripplex.com
          # were migrated to Railway on 2026-08-22 and MUST NOT be listed. Both
          # helpers above are destructive to a migrated host:
          #
          #   delete_conflicting_dns  deletes the A/AAAA/CNAME records the
          #                           migration created — including the CNAME
          #                           pointing at Railway's per-domain edge
          #   attach                  re-binds the hostname to a Worker, which
          #                           takes precedence and is invisible in the
          #                           Cloudflare DNS tab
          #
          # Running this with a migrated host listed silently reverts it: the
          # Railway CNAME disappears, its certificate stops renewing, and the
          # host serves whatever stale build the Worker last deployed. The apex
          # is the account-deletion URL Google Play requires, so that revert
          # would also break the store listing.
          #
          # Adding a host back here is only correct if it is genuinely being
          # moved back to Workers. Check what serves it first:
          #   curl -sI https://<host>/ | grep -i '^server:'
          #   railway-hikari -> Railway, leave it out.  cloudflare -> Workers.
          # Founder decision, 2026-08-30: merchant.dripplex.com and
          # rider.dripplex.com are retired. Both roles work in the Super App,
          # nothing links to either host, and this repair job re-attaching them
          # is exactly how the retirement would quietly undo itself.
          #
          # Nothing left to attach. `attach` is still defined above so putting
          # a host back is one line, and the Workers still deploy, so it is a
          # line plus a DNS record — never a rebuild.
          echo "No Worker-served custom domains to attach."

      # Probes every production hostname, not just the ones attached above — a
      # migrated host turning red here is the signal that something reverted it
      # to a Worker. `server` says which side answered:
      # railway-hikari = Railway, cloudflare = Worker.
      - name: Probe
        if: always()
        run: |
          set +e
          for u in https://dripplex.com https://www.dripplex.com https://app.dripplex.com https://ops.dripplex.com; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' --max-time 25 "$u" || echo 000)
            srv=$(curl -sI --max-time 25 "$u" | tr -d '\r' | awk 'tolower($1)=="server:"{print $2; exit}')
            title=$(python3 -c "import re; t=open('/tmp/p.html','rb').read().decode('utf-8','ignore'); m=re.search(r'<title>([^<]+)',t); print(m.group(1)[:60] if m else '')")
            echo "$code ${srv:-?} $u | $title"
          done
